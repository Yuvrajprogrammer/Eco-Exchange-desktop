<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoExchange - Industrial Symbiosis Platform</title>
  <!-- Tailwind CSS CDN -->
  <link rel="stylesheet" href="../../styles/output.css">
  <style>
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }

    @keyframes auroraFloat {
      0%, 100% {
        transform: translate(0px, 0px) scale(1);
      }
      50% {
        transform: translate(20px, -20px) scale(1.1);
      }
    }

    @keyframes shimmerBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    .animate-fade-in {
      animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .aurora-glow {
      animation: auroraFloat 8s ease-in-out infinite;
    }

    .shimmer-progress {
      animation: shimmerBar 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    body {
      user-select: none;
      -webkit-app-region: drag;
    }
  </style>
</head>
<body class="bg-[#020617] text-slate-100 h-screen w-screen flex flex-col justify-center items-center overflow-hidden font-sans relative">

  <!-- Dynamic Background Aurora Elements -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-emerald-600/20 rounded-full blur-[120px] aurora-glow pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-teal-600/15 rounded-full blur-[140px] aurora-glow pointer-events-none" style="animation-delay: -4s;"></div>

  <!-- Central Glassmorphism Container -->
  <div class="relative z-10 flex flex-col items-center p-10 rounded-3xl bg-slate-900/40 border border-slate-800/80 backdrop-blur-xl shadow-2xl shadow-emerald-950/20 animate-fade-in max-w-md w-full mx-4">
    
    <!-- Real Saved Logo Image Wrapper -->
    <div class="relative flex items-center justify-center mb-6">
      <div class="absolute inset-0 bg-emerald-500/20 rounded-2xl blur-xl animate-pulse"></div>
      <div class="relative w-24 h-24 rounded-2xl bg-slate-950/60 flex items-center justify-center shadow-lg shadow-emerald-900/40 border border-emerald-500/30 p-3">
        <!-- Corrected Path for nested structure -->
        <img src="../../../assets/icons/logo.png" alt="EcoExchange Logo" class="w-full h-full object-contain drop-shadow-md" />
      </div>
    </div>

    <!-- Title with Gradient Clip -->
    <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-200 to-white uppercase mb-1 text-center">
      EcoExchange
    </h1>
    
    <!-- Region Tagline -->
    <p class="text-[11px] font-semibold tracking-[0.25em] text-emerald-500 uppercase mb-8 text-center">
      Delhi-NCR B2B Industrial Symbiosis
    </p>

    <!-- Sleek Loading Bar Container -->
    <div class="w-full bg-slate-950/80 h-1.5 rounded-full overflow-hidden p-[1px] border border-slate-800 mb-4">
      <div class="h-full bg-gradient-to-r from-emerald-500 to-teal-300 rounded-full shimmer-progress"></div>
    </div>

    <!-- Status Text -->
    <div class="flex justify-between w-full text-[10px] text-slate-500 font-medium tracking-widest uppercase">
      <span>Initializing Secure Core</span>
      <span class="text-emerald-400">v1.0 Live</span>
    </div>
    
  </div>

  <!-- Bottom Copyright Footer -->
  <div class="absolute bottom-6 text-[10px] text-slate-600 uppercase tracking-widest font-semibold z-10">
    Enterprise Registry & Marketplace Engine
  </div>

  <script>
    // Seamless Transition to Public Homepage (Form 2) after 2.4 seconds
    setTimeout(() => {
      if (window.electronAPI && window.electronAPI.splashFinished) {
        window.electronAPI.splashFinished();
      } else {
        // Fallback connecting straight to Form 2 (Public Homepage)
        window.location.href = '../02-public-home/public-home.html';
      }
    }, 2400);
  </script>
</body>
</html>
