<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoExchange</title>

  <!-- 1. Theme Persistence (Must be at the very top of <head>) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      // Default to light mode if not explicitly set to 'dark'
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <!-- 2. Local CSS Output -->
  <link rel="stylesheet" href="../../styles/output.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center px-4 py-8">

  <div class="max-w-md w-full space-y-4">
    <!-- Back Button -->
    <button type="button" id="backBtn" class="inline-flex items-center text-xs text-slate-400 hover:text-emerald-400 transition-colors cursor-pointer">
      <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      Back to Home
    </button>

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 relative">
      
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold tracking-wider text-emerald-400">ECOEXCHANGE</h1>
        <p class="text-sm text-slate-400 mt-1">Delhi-NCR B2B Industrial Symbiosis Portal</p>
      </div>

      <!-- Error/Status Message Banner -->
      <div id="errorMsg" class="hidden mb-4 p-3 bg-rose-500/20 border border-rose-500 text-rose-300 text-sm rounded-lg"></div>

      <form id="loginForm" class="space-y-4">
        <!-- GSTIN Input -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">15-Digit GSTIN</label>
          <input 
            type="text" 
            id="gstin" 
            required 
            maxlength="15" 
            placeholder="e.g. 07AAACM2007J1ZU" 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 uppercase focus:outline-none focus:border-emerald-500 font-mono tracking-wide"
          >
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
          <input 
            type="password" 
            id="password" 
            required 
            placeholder="••••••••" 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500"
          >
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-emerald-600/20 mt-2"
        >
          Sign In to Marketplace
        </button>
      </form>

      <!-- Register Link -->
      <div class="text-center mt-6">
        <p class="text-xs text-slate-400">
          New industrial unit? 
          <a href="./signup.html" class="text-emerald-400 hover:underline font-semibold">Register Entity</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Self-Contained Firebase & Login Handler Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyA3lvy7ue2Ydc5vfoIaWo6T7mTs6ZOj8Uw",
      authDomain: "ecoexchange-delhincr.firebaseapp.com",
      projectId: "ecoexchange-delhincr",
      storageBucket: "ecoexchange-delhincr.firebasestorage.app",
      messagingSenderId: "706965615607",
      appId: "1:706965615607:web:f5f1e1985bce759207f4f2",
      measurementId: "G-L1GEHS58BR"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Fixed Back Button Handler Path
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = '../02-public-home/public-home.html';
    });

    const form = document.getElementById('loginForm');
    const gstinInput = document.getElementById('gstin');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');

      const gstin = gstinInput.value.trim().toUpperCase();
      const password = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Verifying GSTIN & Signing In...";

      try {
        // 1. Query Firestore enterprises collection to find the email tied to this GSTIN
        const q = query(collection(db, "enterprises"), where("gstin", "==", gstin));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          throw new Error("No enterprise found registered with this GSTIN. Please check your number or register first.");
        }

        // Extract corporate email from the enterprise document
        const enterpriseData = querySnapshot.docs[0].data();
        const email = enterpriseData.email;

        if (!email) {
          throw new Error("Account configuration error: No email linked to this GSTIN.");
        }

        // 2. Authenticate user with Firebase Auth using the retrieved email and password
        await signInWithEmailAndPassword(auth, email, password);

        console.log("Login successful! Redirecting to marketplace feed...");

        // 3. Redirect to Marketplace Buy Feed
        window.location.href = '../04-buy/buy-feed.html';

      } catch (error) {
        console.error("Login error:", error);
        errorMsg.textContent = "Login failed: " + error.message;
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In to Marketplace";
      }
    });
  </script>
</body>
</html>
