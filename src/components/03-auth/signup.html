<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoExchange - Enterprise Registration</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../styles/main.css">
</head>
<body class="bg-[#020617] text-slate-100 h-screen w-screen flex flex-col justify-between overflow-hidden select-none">

  <!-- Top Taskbar / Navigation -->
  <div class="h-14 w-full drag-region flex items-center justify-between px-6 border-b border-slate-800/80 bg-slate-950/90">
    <div class="flex items-center space-x-3">
      <img src="../../../assets/icons/logo.png" alt="EcoExchange Logo" class="w-7 h-7 object-contain" />
      <span class="text-sm font-black tracking-wider text-white uppercase">EcoExchange <span class="text-emerald-400 text-xs font-normal">Delhi-NCR</span></span>
    </div>
    <div class="no-drag flex items-center space-x-2">
      <a href="../02-public-home/public-home.html" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition-colors">
        ← Back to Public Feed
      </a>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="flex-1 overflow-y-auto flex items-center justify-center p-6 bg-gradient-to-b from-slate-950/40 to-slate-950">
    <div class="bg-slate-900/40 border border-slate-800/80 rounded-3xl p-8 max-w-lg w-full backdrop-blur-xl shadow-2xl shadow-emerald-950/30">
      
      <div class="text-center mb-6">
        <h1 class="text-xl font-black tracking-tight text-white uppercase">Register Industrial Entity</h1>
        <p class="text-xs text-slate-400 mt-1">Connect your Delhi-NCR manufacturing unit to the secure symbiosis network.</p>
      </div>

      <!-- Registration Form -->
      <form id="signupForm" class="space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Industrial Entity / Company Name -->
          <div>
            <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1.5">Industrial Entity Name</label>
            <input 
              type="text" 
              id="entityName" 
              required 
              placeholder="e.g. Apex Textile Mills Pvt Ltd" 
              class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors"
            />
          </div>

          <!-- 15-Digit GSTIN Field -->
          <div>
            <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1.5">15-Digit GSTIN Verification</label>
            <input 
              type="text" 
              id="gstin" 
              maxlength="15" 
              required 
              placeholder="07AAAAA0000A1Z5" 
              class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-200 placeholder-slate-600 uppercase focus:outline-none focus:border-emerald-500 transition-colors"
            />
          </div>
        </div>

        <!-- Corporate Email -->
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1.5">Corporate Email Address</label>
          <input 
            type="email" 
            id="email" 
            required 
            placeholder="admin@apextextiles.co.in" 
            class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors"
          />
        </div>

        <!-- Secure Password -->
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1.5">Secure Password</label>
          <input 
            type="password" 
            id="password" 
            required 
            placeholder="••••••••••••" 
            class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors"
          />
        </div>

        <!-- Mandatory Non-Hazardous Pledge Checkbox -->
        <div class="flex items-start space-x-3 pt-2">
          <input 
            type="checkbox" 
            id="pledgeCheck" 
            required 
            class="mt-0.5 h-4 w-4 rounded border-slate-800 bg-slate-950 text-emerald-600 focus:ring-emerald-500 accent-emerald-500 cursor-pointer"
          />
          <label for="pledgeCheck" class="text-[11px] text-slate-300 leading-relaxed cursor-pointer">
            I pledge that our facility will <strong class="text-white font-medium">strictly transact non-hazardous industrial waste only</strong>, complying with Delhi-NCR environmental standards.
          </label>
        </div>

        <!-- Error Message Container -->
        <div id="errorMsg" class="hidden text-xs text-red-400 bg-red-950/30 border border-red-500/20 p-3 rounded-xl"></div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full mt-2 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black text-xs uppercase tracking-widest shadow-lg shadow-emerald-950/50 transition-all cursor-pointer">
          Verify & Register Entity
        </button>

      </form>

      <!-- Footer switch to login -->
      <div class="mt-6 text-center text-xs text-slate-400">
        Already registered your enterprise? 
        <a href="login.html" class="text-emerald-400 hover:underline font-bold ml-1">Login here</a>
      </div>

    </div>
  </main>

  <!-- Bottom Footer Status -->
  <div class="h-8 w-full bg-slate-950 border-t border-slate-800 flex items-center justify-between px-6 text-[10px] text-slate-500">
    <div>EcoExchange Authentication Core</div>
    <div>Secure B2B Prototype v1.0</div>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { auth, db } from '../../firebase-config.js';
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js";

    const form = document.getElementById('signupForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      
      const entityName = document.getElementById('entityName').value.trim();
      const gstin = document.getElementById('gstin').value.trim().toUpperCase();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const pledgeChecked = document.getElementById('pledgeCheck').checked;

      // Validate GSTIN format (15 characters)
      if (gstin.length !== 15) {
        errorMsg.textContent = "Error: GSTIN must be exactly 15 characters long.";
        errorMsg.classList.remove('hidden');
        return;
      }

      if (!pledgeChecked) {
        errorMsg.textContent = "Error: You must accept the non-hazardous pledge to register.";
        errorMsg.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Registering Entity...";

      try {
        // Create user in Firebase Auth
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Save enterprise profile data in Firestore
        await setDoc(doc(db, "enterprises", user.uid), {
          uid: user.uid,
          entityName: entityName,
          gstin: gstin,
          email: email,
          pledgeAccepted: true,
          createdAt: new Date().toISOString()
        });

        // Redirect to Buy/Sell Dashboard upon successful registration
        window.location.href = '../04-dashboard/buy-sell-dashboard.html';

      } catch (error) {
        console.error("Signup error:", error);
        errorMsg.textContent = "Registration failed: " + error.message;
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = "Verify & Register Entity";
      }
    });
  </script>
</body>
</html>
