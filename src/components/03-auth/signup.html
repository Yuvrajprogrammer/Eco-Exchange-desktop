<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoExchange</title>

  <!-- 1. Theme Persistence (Must be at the very top of <head>) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      // Default to light mode if not explicitly set to 'dark'
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <!-- 2. Local CSS Output -->
  <link rel="stylesheet" href="../../styles/output.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center px-4">

  <div class="max-w-md w-full bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 relative">
    
    <!-- Back Button -->
    <button type="button" id="backBtn" class="inline-flex items-center text-xs text-slate-400 hover:text-emerald-400 mb-6 transition-colors cursor-pointer">
      <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      Back to Home
    </button>

    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold tracking-wider text-emerald-400">ECOEXCHANGE</h1>
      <p class="text-sm text-slate-400 mt-1">Delhi-NCR B2B Industrial Symbiosis Portal</p>
    </div>

    <!-- Error/Status Message Banner -->
    <div id="errorMsg" class="hidden mb-4 p-3 bg-rose-500/20 border border-rose-500 text-rose-300 text-sm rounded-lg"></div>

    <form id="signupForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Enterprise Name</label>
        <input type="text" id="entityName" required placeholder="e.g. Samsung India Pvt Ltd" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">15-Digit GSTIN</label>
        <input type="text" id="gstin" required maxlength="15" placeholder="e.g. 07AAACM2007J1ZU" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 uppercase focus:outline-none focus:border-emerald-500 font-mono">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Corporate Email</label>
        <input type="email" id="email" required placeholder="admin@enterprise.co.in" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="password" required pattern="(?=.*[A-Z])(?=.*[\W_]).{8,}" title="Min 8 chars, at least one capital letter and one special character." placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 pr-10 text-slate-100 focus:outline-none focus:border-emerald-500">
          <button type="button" onclick="const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password';" class="absolute right-3 top-3 text-xs text-slate-400 hover:text-emerald-400 focus:outline-none">👁️</button>
        </div>
      </div>

      <div class="flex items-start space-x-3 pt-1">
        <input type="checkbox" id="pledgeCheck" required class="mt-1 h-4 w-4 rounded border-slate-700 bg-slate-900 text-emerald-500 focus:ring-emerald-500">
        <label for="pledgeCheck" class="text-xs text-slate-300 leading-relaxed">
          I pledge that our industrial unit generates exclusively <strong class="text-emerald-400">non-hazardous</strong> secondary outputs.
        </label>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-emerald-600/20 mt-2">
        Register Entity
      </button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3lvy7ue2Ydc5vfoIaWo6T7mTs6ZOj8Uw",
      authDomain: "ecoexchange-delhincr.firebaseapp.com",
      projectId: "ecoexchange-delhincr",
      storageBucket: "ecoexchange-delhincr.firebasestorage.app",
      messagingSenderId: "706965615607",
      appId: "1:706965615607:web:f5f1e1985bce759207f4f2",
      measurementId: "G-L1GEHS58BR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = '../02-public-home/public-home.html';
    });

    const form = document.getElementById('signupForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');

      const entityName = document.getElementById('entityName').value.trim();
      const gstin = document.getElementById('gstin').value.trim().toUpperCase();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const pledgeAccepted = document.getElementById('pledgeCheck').checked;

      if (!pledgeAccepted) {
        errorMsg.textContent = "Error: You must accept the non-hazardous pledge.";
        errorMsg.classList.remove('hidden');
        return;
      }

      // Basic email validation check
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorMsg.textContent = "Error: Please enter a valid corporate email address (e.g. admin@enterprise.co.in).";
        errorMsg.classList.remove('hidden');
        return;
      }

      // GSTIN format validation check
      const gstinRegex = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/;
      if (!gstinRegex.test(gstin)) {
        errorMsg.textContent = "Error: Please enter a valid 15-character GSTIN format (e.g. 07AAACM2007J1ZU).";
        errorMsg.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Registering Entity...";

      try {
        // 1. Check duplicate GSTIN in Firestore
        const q = query(collection(db, "enterprises"), where("gstin", "==", gstin));
        const querySnapshot = await getDocs(q);
        
        if (!querySnapshot.empty) {
          throw new Error("This GSTIN is already registered on EcoExchange.");
        }

        // 2. Create Firebase Auth user
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // 3. Save enterprise profile to Firestore
        await setDoc(doc(db, "enterprises", user.uid), {
          uid: user.uid,
          entityName: entityName,
          gstin: gstin,
          email: email,
          pledgeAccepted: true,
          role: "industrial_facility",
          createdAt: new Date().toISOString()
        });

        // 4. Redirect to marketplace feed
        window.location.href = '../04-buy/buy-feed.html';

      } catch (error) {
        console.error("Signup error:", error);
        errorMsg.textContent = "Registration failed: " + error.message;
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = "Register Entity";
      }
    });
  </script>
</body>
</html>
