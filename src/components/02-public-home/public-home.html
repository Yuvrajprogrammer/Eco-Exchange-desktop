<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoExchange - Ecological and Economic Exchange</title>

  <!-- Global Theme Persistence Script -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <!-- Instant Tailwind CSS CDN (Guarantees styling loads without compilation issues) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full w-full bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-6 select-none overflow-hidden">

  <!-- Main Splash Container -->
  <div class="max-w-md w-full text-center space-y-8">
    
    <!-- App Logo & Full Name with Bouncing Animation -->
    <div class="flex flex-col items-center space-y-4">
      <div class="w-20 h-20 rounded-2xl bg-emerald-600 flex items-center justify-center text-white font-extrabold text-3xl tracking-wider shadow-lg shadow-emerald-600/30 animate-bounce">
        EX
      </div>
      <div class="space-y-1.5">
        <h1 class="text-3xl font-black tracking-tight text-white">ECOEXCHANGE</h1>
        <p class="text-[11px] text-slate-400 font-medium tracking-widest uppercase">B2B Industrial Symbiosis Platform</p>
      </div>
    </div>

    <!-- Brief Description -->
    <p class="text-xs text-slate-400 max-w-sm mx-auto leading-relaxed">
      Secure enterprise corridor for managing non-hazardous material outputs, direct dealer negotiations, and transaction tracking across Delhi-NCR.
    </p>

    <!-- Jumping / Animated Login & Sign-Up Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-4">
      <a href="../03-auth/login.html" class="w-full sm:w-40 py-3 rounded-xl border border-slate-700 bg-slate-900 text-slate-200 hover:bg-slate-800 hover:border-slate-600 font-semibold text-xs transition-all shadow-sm animate-bounce text-center">
        LOGIN
      </a>
      <a href="../03-auth/signup.html" class="w-full sm:w-40 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs transition-all shadow-lg shadow-emerald-600/20 animate-bounce text-center">
        SIGN UP
      </a>
    </div>

  </div>

  <!-- Footer Info -->
  <footer class="absolute bottom-6 text-center text-[11px] text-slate-600">
    Delhi-NCR Corridor • Secure B2B Prototype v1.0
  </footer>

</body>
</html>
